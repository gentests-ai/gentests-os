<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D08 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D08 | Edição posterior e relatório anterior</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D08 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Você alterou os dados do cálculo</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Fixture de edição: custo-hora de QA atualizado de 90,00 para 95,00. O resultado anterior não representa os novos valores.</text><rect x="48" y="259" width="984" height="80.5" rx="12" fill="#FFF5DF" stroke="none"/><text x="68" y="288.28" fill="#805000" font-family="DM Sans" font-weight="700" font-size="16">Resultado desatualizado</text><text x="68" y="314.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">Recalcule para gerar um novo resultado e solicitar outro relatório. As comparações com Recursos precisam ser revistas.</text><rect x="48" y="399" width="984" height="270" rx="18" fill="#FFFFFF" stroke="none"/><text x="80" y="448.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">QA · custo-hora integral (R$/h)</text><rect x="80" y="463" width="410" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="94" y="492.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">95,00</text><text x="80" y="532.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Origem hipotética preservada. Comparações com R</text><text x="80" y="553.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">invalidadas.</text><rect x="80" y="582" width="250" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="96" y="611.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Revisar comparações</text><rect x="770" y="582" width="230" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="786" y="611.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Recalcular</text><rect x="48" y="707" width="260" height="48" rx="10" fill="#F3F6FA" stroke="#64788D"/><text x="64" y="736.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">Imprimir novo relatório</text><rect x="1068" y="259" width="324" height="490" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="306.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Relatório anterior</text><text x="1092" y="356.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Solicitado com o cálculo</text><text x="1092" y="383.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">anterior. Seu conteúdo</text><text x="1092" y="410.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">permanece vinculado àquele</text><text x="1092" y="437.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">resultado.</text><text x="1092" y="481.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">P1 · 10/10/2026 17:52</text><text x="1092" y="521.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">Método: CNQ-01</text><text x="1092" y="564.43" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="21">Valor: R$ 4.760,00</text><text x="1092" y="612.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Prévia preparada. Não afirmar “salvo”</text><text x="1092" y="634.95" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">ou “impresso” sem evidência. P1 e S1</text><text x="1092" y="657.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">são identificadores ilustrativos.</text><rect x="48" y="800" width="984" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="829.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">O pedido anterior não muda</text><text x="68" y="855.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Editar, limpar ou carregar o exemplo não sobrescreve a impressão já solicitada. Novo cálculo exige nova ação explícita de impressão,</text><text x="68" y="877.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">com outro identificador.</text></svg>