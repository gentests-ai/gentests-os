<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D01 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D01 | Inicial vazio</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D01 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Calculadora de custo da não qualidade de software</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Estime o impacto econômico de um incidente. Seus valores não são perdas verificadas.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="64" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="312" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="808" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="330" width="984" height="484" rx="18" fill="#FFFFFF" stroke="none"/><text x="80" y="383.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">Comece pelo esforço da equipe</text><text x="80" y="425.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Informe apenas o que você conhece. Campo vazio é desconhecido; não será convertido em zero. Você</text><text x="80" y="452.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">também pode explorar um exemplo fictício.</text><text x="80" y="515.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Desenvolvimento</text><rect x="372" y="495" width="115.468" height="30" rx="15" fill="#F3F6FA" stroke="none"/><text x="384" y="513.79" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="13">Desconhecido</text><rect x="746" y="490" width="248" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="762" y="519.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Preencher este grupo</text><text x="80" y="599.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">QA / testes</text><rect x="372" y="579" width="115.468" height="30" rx="15" fill="#F3F6FA" stroke="none"/><text x="384" y="597.79" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="13">Desconhecido</text><rect x="746" y="574" width="248" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="762" y="603.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Preencher este grupo</text><text x="80" y="683.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Suporte</text><rect x="372" y="663" width="115.468" height="30" rx="15" fill="#F3F6FA" stroke="none"/><text x="384" y="681.79" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="13">Desconhecido</text><rect x="746" y="658" width="248" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="762" y="687.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Preencher este grupo</text><rect x="1068" y="330" width="324" height="330" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="374.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Sem resultado ainda</text><text x="1092" y="422.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Nenhum valor foi informado.</text><text x="1092" y="449.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Informe ao menos uma parcela</text><text x="1092" y="476.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">para estimar.</text><rect x="48" y="848" width="278" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="64" y="877.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Usar exemplo fictício</text><rect x="344" y="848" width="250" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="360" y="877.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Como funciona o método</text><rect x="48" y="927" width="984" height="80.5" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="956.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Sem cadastro</text><text x="68" y="982.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Proposta de cálculo local e impressão. Sem captura de leads ou envio por e-mail na Fase 1.</text></svg>