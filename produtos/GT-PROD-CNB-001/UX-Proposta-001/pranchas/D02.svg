-family="Manrope" font-weight="700" font-size="24">R$ 280,00</text><rect x="1068" y="365" width="324" height="390" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="407.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Seu resumo</text><text x="1092" y="446.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Valores em revisão. O resultado será</text><text x="1092" y="470.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">gerado ao calcular.</text><text x="1092" y="526.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Recursos</text><text x="1253" y="526.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 2.260,00</text><text x="1092" y="568.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Despesa externa</text><text x="1253" y="568.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 600,00</text><text x="1092" y="610.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Ajuste de receita</text><text x="1253" y="610.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 900,00</text><text x="1092" y="652.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Margem líquida</text><text x="1253" y="652.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 1.000,00</text><text x="1092" y="702.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipóteses do exemplo fictício.</text><text x="1092" y="723.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Não são perdas verificadas.</text><rect x="48" y="838" width="260" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="867.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Adicionar operação</text><rect x="328" y="828" width="704" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="348" y="857.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Horas sem repetição</text><text x="348" y="883.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Exemplo: unicidade assumida como hipótese fictícia. Na estimativa própria, responder “Sim” ou</text><text x="348" y="905.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">“Não sei” por grupo; “Não sei” exclui o custo do grupo.</text><rect x="48" y="973" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="1002.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar</text><rect x="774" y="973" width="258" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="790" y="1002.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Continuar: efeitos</text></svg>