<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D03 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D03 | Efeitos e comparação contextual</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D03 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Estas parcelas representam efeitos distintos?</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Compare cada par com os valores e origens atuais. Referências diferentes não comprovam distinção.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="312" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="808" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="313" width="367.213" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="60" y="331.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Exemplo fictício · relações assumidas como hipóteses</text><rect x="48" y="365" width="324" height="120" rx="14" fill="#FFFFFF" stroke="none"/><text x="66" y="397.11" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="17">R · Recursos</text><text x="66" y="436.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 2.260,00</text><text x="66" y="463.62" fill="#805000" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipotética</text><rect x="388" y="365" width="324" height="120" rx="14" fill="#FFFFFF" stroke="none"/><text x="406" y="397.11" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="17">E · Despesa externa</text><text x="406" y="436.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 600,00</text><text x="406" y="463.62" fill="#805000" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipotética</text><rect x="728" y="365" width="324" height="120" rx="14" fill="#FFFFFF" stroke="none"/><text x="746" y="397.11" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="17">A · Ajuste de receita</text><text x="746" y="436.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 900,00</text><text x="746" y="463.62" fill="#805000" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipotética</text><rect x="1068" y="365" width="324" height="120" rx="14" fill="#FFFFFF" stroke="none"/><text x="1086" y="397.11" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="17">O · Margem não recuperável</text><text x="1086" y="436.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 1.000,00</text><text x="1086" y="463.62" fill="#805000" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipotética</text><rect x="48" y="514" width="880" height="377" rx="18" fill="#FFFFFF" stroke="none"/><text x="72" y="557.92" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="24">Comparação A ↔ O</text><text x="72" y="594.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Ajuste líquido de receita · R$ 900,00 · hipotético · Evento local A</text><text x="72" y="619.61" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Margem não recuperável · R$ 1.000,00 · hipotética · Evento local B</text><text x="72" y="681.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Qual é a relação entre esses valores?</text><rect x="72" y="704" width="18" height="18" rx="9" fill="#34E2D1" stroke="#142B3F"/><text x="105" y="717.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">Distintos</text><rect x="72" y="745" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#142B3F"/><text x="105" y="758.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">Sobrepostos</text><rect x="72" y="786" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#142B3F"/><text x="105" y="799.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">Não sei</text><rect x="72" y="827" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#142B3F"/><text x="105" y="840.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">Parcelas incrementais distintas</text><rect x="960" y="514" width="432" height="377" rx="18" fill="#FFFFFF" stroke="none"/><text x="984" y="557.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Todas as comparações</text><text x="984" y="598.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">E ↔ R · distinta (hipótese)</text><text x="984" y="638.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">A ↔ R · distinta (hipótese)</text><text x="984" y="678.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">O ↔ R · distinta (hipótese)</text><text x="984" y="718.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">E ↔ A · distinta (hipótese)</text><text x="984" y="758.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">E ↔ O · distinta (hipótese)</text><text x="984" y="798.28" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="16">A ↔ O · distinta (hipótese)</text><rect x="48" y="916" width="880" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="945.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Declaração contextual</text><text x="68" y="971.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">A ferramenta não verifica documentos nem comprova ausência de duplicidade. Editar valor, origem, estado ou</text><text x="68" y="993.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">referência exige revisar as relações.</text><rect x="960" y="928" width="160" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="976" y="957.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar</text><rect x="1138" y="928" width="254" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="1154" y="957.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Continuar</text></svg>