<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>TOKENS - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">Sistema visual | Identidade e componentes</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">TOKENS | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Precisão técnica com uma leitura tranquila.</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Ativo oficial preservado. Manrope nos títulos; DM Sans em corpo, campos e números, conforme o site.</text><rect x="48" y="285" width="244" height="86" rx="12" fill="#04132F" stroke="none"/><text x="48" y="403.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Azul institucional</text><text x="48" y="433.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">#04132F</text><rect x="316" y="285" width="244" height="86" rx="12" fill="#34E2D1" stroke="none"/><text x="316" y="403.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Turquesa da marca</text><text x="316" y="433.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">#34E2D1</text><rect x="584" y="285" width="244" height="86" rx="12" fill="#075BDF" stroke="none"/><text x="584" y="403.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Ação textual</text><text x="584" y="433.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">#075BDF</text><rect x="852" y="285" width="244" height="86" rx="12" fill="#142B3F" stroke="none"/><text x="852" y="403.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Texto principal</text><text x="852" y="433.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">#142B3F</text><rect x="1120" y="285" width="244" height="86" rx="12" fill="#805000" stroke="none"/><text x="1120" y="403.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Aviso + texto</text><text x="1120" y="433.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">#805000</text><text x="48" y="512.41" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="27">Hierarquia</text><text x="48" y="578.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Título desktop · 34 px</text><text x="48" y="634.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">Título mobile · 28–30 px</text><text x="48" y="682.94" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="18">Corpo · 16–18 px / entrelinha 1,5</text><text x="48" y="728.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Ajuda · 14–15 px; nunca menor no produto</text><text x="780" y="512.41" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="27">Componentes</text><rect x="780" y="548" width="280" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="796" y="577.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ação principal</text><rect x="1080" y="548" width="280" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="1096" y="577.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ação secundária</text><text x="780" y="658.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Valor monetário (R$)</text><rect x="780" y="673" width="280" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="794" y="702.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">1.234,56</text><text x="780" y="742.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Unidade fora do valor digitado.</text><rect x="1080" y="645" width="91.652" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="1092" y="663.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Hipotético</text><rect x="1080" y="700" width="115.468" height="30" rx="15" fill="#F3F6FA" stroke="none"/><text x="1092" y="718.79" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="13">Desconhecido</text><rect x="48" y="822" width="880" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="851.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Escala de espaçamento</text><text x="68" y="877.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Base 4 px: 4, 8, 12, 16, 24, 32, 48, 64. Campos e botões ≥48 px; alvos ≥44×44 px. Raios: 8 campo, 10 botão, 16–20 painel.</text><text x="68" y="899.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Borda de campo #64788D.</text><text x="960" y="850.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Foco: contorno externo azul em superfície clara,</text><text x="960" y="875.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">turquesa em fundo escuro, 3 px com 3 px de</text><text x="960" y="901.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">afastamento. Não usar turquesa como texto sobre</text><text x="960" y="926.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">branco.</text></svg>