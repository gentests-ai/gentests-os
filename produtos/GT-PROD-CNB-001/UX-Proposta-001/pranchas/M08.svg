ke="none"/><text x="40" y="557.28" fill="#805000" font-family="DM Sans" font-weight="700" font-size="16">2 parcelas excluídas</text><text x="40" y="583.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">Ajuste de receita e margem não</text><text x="40" y="605.95" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">recuperável: comparação sem resposta</text><text x="40" y="628.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">específica. Valores não entram na soma.</text><text x="20" y="746.6" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="20">Projeção das parcelas incluídas</text><text x="20" y="802.41" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="27">R$ 8.580,00 / mês</text><text x="20" y="847.75" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="25">R$ 102.960,00 / 12 meses</text><text x="20" y="898.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Hipótese constante de 3 incidentes/mês. Sem</text><text x="20" y="922.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">auditoria, comprovação de perda ou</text><text x="20" y="946.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">monetização de reputação.</text><rect x="20" y="1002" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="1031.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Revisar comparação</text><rect x="20" y="1066" width="350" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="36" y="1095.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Relatório incompleto</text></svg>