<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" role="img"><title>R03 - proposta de interface não operacional</title><rect x="0" y="0" width="595" height="842" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="595" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="495" y="41.79" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="13">Protótipo</text><text x="20" y="813.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">R03 | Planejamento v0.1 | Produto v0.1.1</text><text x="20" y="829.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">10/10/2026 · Proposta não operacional</text><rect x="0" y="80" width="595" height="762" rx="0" fill="#FFFFFF" stroke="none"/><text x="24" y="115.78999999999999" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="13">MEMÓRIA, ORIGENS E EXCLUSÕES</text><text x="24" y="146.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Prévia compartilhada: escolher R01 ou R02 define o snapshot.</text><text x="24" y="190.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">Dev: 12h × 120,00 = R$ 1.440,00</text><text x="24" y="222.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">QA: 6h × 90,00 = R$ 540,00</text><text x="24" y="254.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">Suporte: 4h × 70,00 = R$ 280,00</text><text x="24" y="286.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">R = 1.440,00 + 540,00 + 280,00 = R$ 2.260,00</text><text x="24" y="318.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">R01: T = R + 600,00 + 900,00 + 1.000,00 = R$ 4.760,00</text><text x="24" y="350.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">R02: subtotal = R + 600,00 = R$ 2.860,00</text><text x="24" y="402.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Todas as origens são hipotéticas. R01: seis comparações distintas assumidas como hipóteses. R02: E/R</text><text x="24" y="418.63" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">distinto; A/O sem resposta, excluídos. Referências locais diferentes não comprovam distinção. Operação</text><text x="24" y="435.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">N/A confirmada no exemplo; contexto desconhecido.</text><text x="24" y="533.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Arredondamento half-up por bloco de horas antes da soma. Projeções multiplicam parcelas incluídas por</text><text x="24" y="549.63" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">frequência e por 12. Sem ROI, caixa incremental ou perda contábil. Reputação, churn e produtividade de</text><text x="24" y="566.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">clientes não monetizados.</text><text x="24" y="662.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Em produto futuro, cada relatório deve incluir snapshot_hash completo, versões de</text><text x="24" y="678.63" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">schema/produto/método/guia e request_id próprios, congelados antes da paginação. Nesta prévia, P1 é</text><text x="24" y="695.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">ilustrativo; nenhum hash de pedido real foi criado.</text><rect x="24" y="756" width="235" height="38" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="40" y="780.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar ao resultado</text><text x="470" y="779.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">2 / 2</text></svg>