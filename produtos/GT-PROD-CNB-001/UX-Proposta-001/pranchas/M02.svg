<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1250" viewBox="0 0 390 1250" role="img"><title>M02 - proposta de interface não operacional</title><rect x="0" y="0" width="390" height="1250" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="390" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="290" y="41.79" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="13">Protótipo</text><text x="20" y="111.62" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="14">M02 | Esforço · exemplo</text><text x="20" y="1221.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">M02 | Planejamento v0.1 | Produto v0.1.1</text><text x="20" y="1237.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">10/10/2026 · Proposta não operacional</text><text x="20" y="167.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">Quanto esforço foi</text><text x="20" y="209.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">necessário?</text><rect x="20" y="243" width="117.28800000000001" height="30" rx="15" fill="#E6F8F5" stroke="none"/><text x="32" y="261.79" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="13">1 de 4 · Esforço</text><rect x="20" y="294" width="350" height="103.0" rx="12" fill="#FFF5DF" stroke="none"/><text x="40" y="323.28" fill="#805000" font-family="DM Sans" font-weight="700" font-size="16">Exemplo fictício</text><text x="40" y="349.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">Simulação do guia. Não representa uma</text><text x="40" y="371.95" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">empresa real. Valores hipotéticos.</text><rect x="20" y="433" width="350" height="560" rx="16" fill="#FFFFFF" stroke="none"/><text x="40" y="478.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">Desenvolvimento</text><rect x="40" y="504" width="91.652" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="52" y="522.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Hipotético</text><text x="40" y="570.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Horas únicas (h)</text><rect x="40" y="585" width="310" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="54" y="614.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">12,00</text><text x="40" y="654.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Some só horas-pessoa sem repetição.</text><text x="40" y="709.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Custo-hora integral (R$/h)</text><rect x="40" y="724" width="310" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="54" y="753.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">120,00</text><text x="40" y="793.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Investigar, corrigir e retestar já compõem estas</text><text x="40" y="814.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">horas.</text><text x="40" y="885.9" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="30">R$ 1.440,00</text><text x="40" y="919.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Calculado · contém hipóteses. Unicidade</text><text x="40" y="943.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">assumida no exemplo.</text><text x="20" y="1032.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">QA e Suporte seguem o mesmo componente,</text><text x="20" y="1054.95" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">empilhados. Resumo após os campos; sem painel</text><text x="20" y="1077.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">fixo.</text><rect x="20" y="1117" width="350" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="36" y="1146.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Continuar: efeitos distintos</text></svg>