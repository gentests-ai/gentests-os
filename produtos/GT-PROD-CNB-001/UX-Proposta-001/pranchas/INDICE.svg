<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>INDICE - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">Proposta visual | Calculadora de Custo da Não Qualidade</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">INDICE | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><rect x="48" y="156" width="174.163" height="30" rx="15" fill="#E6F8F5" stroke="none"/><text x="60" y="174.79" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="13">FASE 1 · SEM CADASTRO</text><text x="48" y="262.14" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="58">Entenda o custo.</text><text x="48" y="356.14" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="58">Decida com clareza.</text><text x="48" y="397.92" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="24">Uma jornada progressiva para organizar o impacto econômico de um</text><text x="48" y="433.92" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="24">incidente, explicitar hipóteses e evitar dupla contagem.</text><rect x="48" y="498" width="880" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="527.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Protótipo navegável, com dados fixos</text><text x="68" y="553.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Clique nos botões para percorrer telas. Campos e cálculos não funcionam. A impressão é uma prévia visual; nenhum</text><text x="68" y="575.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">pedido real é criado.</text><rect x="48" y="650" width="270" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="64" y="679.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Iniciar jornada desktop</text><rect x="336" y="650" width="270" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="352" y="679.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver jornada mobile</text><rect x="624" y="650" width="270" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="640" y="679.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver wireframes</text><rect x="48" y="742" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="771.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Conciliação contextual</text><rect x="388" y="742" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="404" y="771.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Resultado completo</text><rect x="728" y="742" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="744" y="771.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Resultado incompleto</text><rect x="1068" y="742" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="1084" y="771.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Edição e cálculo anterior</text><rect x="48" y="816" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="845.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Memória de cálculo</text><rect x="388" y="816" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="404" y="845.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Relatório A4</text><rect x="728" y="816" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="744" y="845.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Estados e validações</text><rect x="1068" y="816" width="320" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="1084" y="845.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Sistema visual</text><text x="48" y="945.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Base: commit 8df9e2f… · PRs #28 e #31 · Decisão #33. Artefato proposto para revisão independente e deliberação da Direção. Sem autorização de implementação, publicação</text><text x="48" y="969.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">ou merge.</text></svg>