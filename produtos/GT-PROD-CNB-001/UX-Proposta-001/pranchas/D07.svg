<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D07 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D07 | Resultado incompleto</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D07 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Veja o impacto econômico estimado</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Valores declarados ou hipotéticos. Esta ferramenta não audita documentos e não comprova perdas.</text><rect x="48" y="245" width="186.96800000000002" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="60" y="263.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Simulação fictícia do guia</text><rect x="48" y="303" width="880" height="235" rx="20" fill="#04132F" stroke="none"/><text x="80" y="349.26" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="22">Subtotal estimado · estimativa incompleta</text><text x="80" y="431.46" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="62">R$ 2.860,00</text><text x="80" y="481.11" fill="#D7E1F2" font-family="DM Sans" font-weight="400" font-size="17">A e O excluídos por comparação não confirmada.</text><rect x="960" y="303" width="432" height="125.5" rx="12" fill="#E6F8F5" stroke="none"/><text x="980" y="332.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Projeções condicionais</text><text x="980" y="358.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Se este custo por incidente e a frequência de 3</text><text x="980" y="380.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">incidentes/mês permanecerem constantes. Somente</text><text x="980" y="403.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">parcelas mensuradas.</text><text x="984" y="468.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 8.580,00 / mês</text><text x="984" y="513.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 102.960,00 / 12 meses</text><rect x="48" y="574" width="1344" height="288" rx="18" fill="#FFFFFF" stroke="none"/><text x="72" y="617.75" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="25">Composição por natureza</text><text x="72" y="664.94" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="18">R · Recursos consumidos</text><text x="720" y="666.6" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="20">R$ 2.260,00</text><text x="1000" y="663.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Hipotético · sem auditoria</text><text x="72" y="710.94" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="18">E · Despesa externa incremental</text><text x="720" y="712.6" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="20">R$ 600,00</text><text x="1000" y="709.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Hipotético · sem auditoria</text><text x="72" y="756.94" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="18">A · Ajuste líquido de receita</text><text x="720" y="758.6" fill="#805000" font-family="DM Sans" font-weight="700" font-size="20">Excluído</text><text x="1000" y="755.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Hipotético · sem auditoria</text><text x="72" y="802.94" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="18">O · Margem líquida não recuperável</text><text x="720" y="804.6" fill="#805000" font-family="DM Sans" font-weight="700" font-size="20">Excluído</text><text x="1000" y="801.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Hipotético · sem auditoria</text><rect x="48" y="900" width="236" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="929.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Memória de cálculo</text><rect x="302" y="900" width="260" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="318" y="929.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Imprimir relatório</text><rect x="580" y="900" width="236" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="596" y="929.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Editar valores</text><text x="48" y="993.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Impactos não monetizados: reputação, churn e produtividade de clientes. Contato e guia poderão ser exibidos apenas após autorização dos destinos e da distribuição do</text><text x="48" y="1017.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">guia.</text></svg>