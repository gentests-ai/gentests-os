<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>ESTADOS - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">Estados de componentes | Contrato visual</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">ESTADOS | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Cada estado tem uma consequência visível.</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Variantes planejadas; não são validações executadas em uma calculadora.</text><rect x="48" y="288" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="68" y="323.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Vazio / desconhecido</text><text x="68" y="366.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado. Fora da soma; nunca zero.</text><rect x="500" y="288" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="520" y="323.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Não aplicável</text><text x="520" y="366.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Escolha explícita. Listar exclusão de escopo.</text><rect x="952" y="288" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="972" y="323.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Zero informado</text><text x="972" y="366.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">0,00 digitado. Taxa zero com horas &gt;0 exige</text><text x="972" y="391.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">confirmação.</text><rect x="48" y="490" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="68" y="525.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Hipotético</text><text x="68" y="568.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Badge “Hipotético”; derivado mantém a origem.</text><rect x="500" y="490" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="520" y="525.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Erro de formato</text><text x="520" y="568.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">1,234 ou 90.00: rejeitar. Sugerir 90,00 sem</text><text x="520" y="593.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">conversão silenciosa.</text><rect x="952" y="490" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="972" y="525.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Conflito / não sei</text><text x="972" y="568.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Excluir envolvidos; subtotal incompleto com</text><text x="972" y="593.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">motivo.</text><rect x="48" y="692" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="68" y="727.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Validando / calculando</text><text x="68" y="770.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Texto de status moderado. Não anunciar cada</text><text x="68" y="795.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">tecla.</text><rect x="500" y="692" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="520" y="727.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Resultado desatualizado</text><text x="520" y="770.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Aviso + novo relatório bloqueado até recalcular.</text><rect x="952" y="692" width="428" height="179" rx="14" fill="#FFFFFF" stroke="#64788D"/><text x="972" y="727.77" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="19">Limite de contexto</text><text x="972" y="770.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">744,01h: contexto não informado; outras</text><text x="972" y="795.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">parcelas continuam válidas.</text><rect x="48" y="925" width="880" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="954.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Limpar ou substituir</text><text x="68" y="980.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Confirmar antes de apagar dados: “Substituir os valores atuais pelo exemplo fictício?” Botões “Cancelar” e “Substituir”.</text><text x="68" y="1002.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Cancelar preserva dados e foco retorna ao disparador.</text><rect x="960" y="947" width="432" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="976" y="976.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver resultado incompleto</text></svg>