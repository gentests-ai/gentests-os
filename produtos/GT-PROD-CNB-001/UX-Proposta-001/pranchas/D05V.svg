<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D05V - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D05V | Revisão válida · exemplo</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D05V | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Tudo pronto para estimar</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Uma revisão final dos valores e das hipóteses. Sem auditoria ou comprovação de perdas.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="312" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="808" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="313" width="176.15200000000002" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="60" y="331.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Exemplo fictício do guia</text><rect x="48" y="365" width="984" height="482" rx="18" fill="#FFFFFF" stroke="none"/><text x="72" y="405.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Recursos</text><text x="600" y="409.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">R$ 2.260,00</text><text x="72" y="436.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">3 blocos · horas únicas hipotéticas</text><text x="72" y="491.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Despesa externa</text><text x="600" y="495.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">R$ 600,00</text><text x="72" y="522.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Distinta de R/A/O · hipótese</text><text x="72" y="577.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Ajuste líquido de receita</text><text x="600" y="581.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">R$ 900,00</text><text x="72" y="608.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Distinto de R/E/O · hipótese</text><text x="72" y="663.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Margem não recuperável</text><text x="600" y="667.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">R$ 1.000,00</text><text x="72" y="694.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Distinta de R/E/A · hipótese</text><text x="72" y="749.94" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="18">Frequência mensal</text><text x="600" y="753.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">3 incidentes</text><text x="72" y="780.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Mesmo perfil · hipótese constante</text><rect x="1068" y="365" width="324" height="390" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="407.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Seu resumo</text><text x="1092" y="446.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Valores em revisão. O resultado será</text><text x="1092" y="470.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">gerado ao calcular.</text><text x="1092" y="526.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Recursos</text><text x="1253" y="526.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 2.260,00</text><text x="1092" y="568.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Despesa externa</text><text x="1253" y="568.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 600,00</text><text x="1092" y="610.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Ajuste de receita</text><text x="1253" y="610.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 900,00</text><text x="1092" y="652.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Margem líquida</text><text x="1253" y="652.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 1.000,00</text><text x="1092" y="702.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipóteses do exemplo fictício.</text><text x="1092" y="723.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Não são perdas verificadas.</text><rect x="48" y="902" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="931.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar</text><rect x="716" y="902" width="316" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="732" y="931.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Calcular estimativa</text><rect x="1068" y="791" width="324" height="148.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="1088" y="820.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Privacidade</text><text x="1088" y="846.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Cálculo proposto na aba. Fechar ou</text><text x="1088" y="868.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">recarregar pode apagar o</text><text x="1088" y="891.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">preenchimento; sem salvamento</text><text x="1088" y="913.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">automático.</text></svg>