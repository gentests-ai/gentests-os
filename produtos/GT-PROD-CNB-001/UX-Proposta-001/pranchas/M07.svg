t="400" font-size="14">Formato inválido. Use 90,00.</text><rect x="20" y="586" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="615.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Corrigir campo de QA</text><rect x="20" y="680" width="350" height="125.5" rx="12" fill="#FFF5DF" stroke="none"/><text x="40" y="709.28" fill="#805000" font-family="DM Sans" font-weight="700" font-size="16">Comparação A/O sem resposta</text><text x="40" y="735.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">A e O excluídos. Referências diferentes não</text><text x="40" y="757.95" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">confirmam distinção. Ainda pode haver</text><text x="40" y="780.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">subtotal válido.</text><rect x="20" y="872" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="901.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Revisar comparação</text><rect x="20" y="936" width="350" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="36" y="965.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver subtotal incompleto</text><text x="20" y="1030.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Erro monetário impede novo resultado. A fixture de</text><text x="20" y="1051.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">subtotal pressupõe formato corrigido.</text></svg>