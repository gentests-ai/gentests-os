<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842" role="img"><title>R05 - proposta de interface não operacional</title><rect x="0" y="0" width="595" height="842" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="595" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="495" y="41.79" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="13">Protótipo</text><text x="20" y="813.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">R05 | Planejamento v0.1 | Produto v0.1.1</text><text x="20" y="829.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">10/10/2026 · Proposta não operacional</text><rect x="0" y="80" width="595" height="762" rx="0" fill="#FFFFFF" stroke="none"/><text x="24" y="114.96" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="12">P2 · SNAPSHOT S2 · EXEMPLO FICTÍCIO EDITADO</text><text x="24" y="181.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">Dev: 12h × 120,00 = R$ 1.440,00</text><text x="24" y="216.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">QA: 6h × 95,00 = R$ 570,00</text><text x="24" y="251.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">Suporte: 4h × 70,00 = R$ 280,00</text><text x="24" y="286.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">R = 1.440,00 + 570,00 + 280,00 = R$ 2.290,00</text><text x="24" y="321.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">T = 2.290,00 + 600,00 + 900,00 + 1.000,00 = R$ 4.790,00</text><text x="24" y="356.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">M = 4.790,00 × 3 = R$ 14.370,00</text><text x="24" y="391.13" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="11">Y = 14.370,00 × 12 = R$ 172.440,00</text><text x="24" y="462.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Todas as origens hipotéticas. Comparações com R revistas explicitamente após edição da taxa de QA.</text><text x="24" y="478.63" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Relações distintas como hipóteses, sem auditoria. Operação N/A, contexto desconhecido e não</text><text x="24" y="495.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">monetizado.</text><text x="24" y="587.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">Half-up por bloco antes da soma. Projeções pressupõem custo e frequência constantes, sem inflação,</text><text x="24" y="603.63" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">juros ou ROI. Não monetizados: reputação, churn e produtividade de clientes. Em implementação futura:</text><text x="24" y="620.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">versões e snapshot_hash completos vinculados a P2 antes da paginação; P1 mantém S1.</text><rect x="24" y="756" width="290" height="38" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="40" y="780.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar ao cálculo atualizado</text><text x="470" y="779.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">2 / 2</text></svg>