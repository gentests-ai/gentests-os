<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1540" viewBox="0 0 390 1540" role="img"><title>M05 - proposta de interface não operacional</title><rect x="0" y="0" width="390" height="1540" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="390" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="290" y="41.79" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="13">Protótipo</text><text x="20" y="111.62" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="14">M05 | Resultado</text><text x="20" y="1511.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">M05 | Planejamento v0.1 | Produto v0.1.1</text><text x="20" y="1527.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">10/10/2026 · Proposta não operacional</text><text x="20" y="167.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">Impacto econômico</text><text x="20" y="209.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">estimado</text><rect x="20" y="247" width="176.15200000000002" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="32" y="265.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Exemplo fictício do guia</text><rect x="20" y="300" width="350" height="223" rx="16" fill="#04132F" stroke="none"/><text x="40" y="337.11" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="17">Impacto gerencial estimado por</text><text x="40" y="362.61" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="17">incidente</text><text x="40" y="429.37" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="39">R$ 4.760,00</text><text x="40" y="474.28" fill="#D7E1F2" font-family="DM Sans" font-weight="400" font-size="16">Sem auditoria ou comprovação de</text><text x="40" y="498.28" fill="#D7E1F2" font-family="DM Sans" font-weight="400" font-size="16">perdas.</text><rect x="20" y="548" width="350" height="285" rx="16" fill="#FFFFFF" stroke="none"/><text x="40" y="590.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">Composição</text><text x="40" y="634.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Recursos</text><text x="245" y="634.45" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="15">R$ 2.260,00</text><text x="40" y="681.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Despesa externa</text><text x="245" y="681.45" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="15">R$ 600,00</text><text x="40" y="728.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Ajuste de receita</text><text x="245" y="728.45" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="15">R$ 900,00</text><text x="40" y="775.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Margem não recuperável</text><text x="245" y="775.45" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="15">R$ 1.000,00</text><rect x="20" y="861" width="350" height="125.5" rx="12" fill="#E6F8F5" stroke="none"/><text x="40" y="890.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Projeções condicionais</text><text x="40" y="916.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Se custo e frequência de 3 incidentes/mês</text><text x="40" y="938.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">permanecerem constantes. Não é custo</text><text x="40" y="961.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">anual observado.</text><text x="20" y="1058.58" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="26">R$ 14.280,00 / mês</text><text x="20" y="1101.75" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="25">R$ 171.360,00 / 12 meses</text><rect x="20" y="1150" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="1179.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Memória de cálculo</text><rect x="20" y="1214" width="350" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="36" y="1243.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Imprimir relatório</text><rect x="20" y="1278" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="1307.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Editar valores</text><text x="20" y="1375.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Não monetizados: reputação, churn e</text><text x="20" y="1399.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">produtividade de clientes. Naturezas</text><text x="20" y="1423.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">hipotéticas; não são caixa.</text></svg>