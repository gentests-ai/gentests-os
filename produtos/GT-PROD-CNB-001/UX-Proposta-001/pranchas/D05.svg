<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D05 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D05 | Revisão e erros antes do cálculo</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D05 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Revise as parcelas antes de calcular</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Fixture de erro: não representa continuação dos valores válidos do exemplo. Dados já digitados são preservados.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="312" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="808" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="332" width="984" height="103.0" rx="12" fill="#FFF0F1" stroke="none"/><text x="68" y="361.28" fill="#B42332" font-family="DM Sans" font-weight="700" font-size="16">Corrija 1 campo para calcular</text><text x="68" y="387.45" fill="#B42332" font-family="DM Sans" font-weight="400" font-size="15">Custo-hora de QA: use vírgula decimal, como 90,00. Ir para o campo de QA. Após acionar Calcular, anunciar o resumo e mover o foco</text><text x="68" y="409.95" fill="#B42332" font-family="DM Sans" font-weight="400" font-size="15">ao primeiro campo inválido.</text><text x="72" y="489.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">QA · custo-hora integral (R$/h)</text><rect x="72" y="504" width="420" height="48" rx="8" fill="#FFFFFF" stroke="#B42332"/><text x="86" y="533.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">90.00</text><text x="72" y="573.62" fill="#B42332" font-family="DM Sans" font-weight="400" font-size="14">Formato inválido. Use 90,00. Não corrigir silenciosamente.</text><rect x="72" y="635" width="912" height="103.0" rx="12" fill="#FFF5DF" stroke="none"/><text x="92" y="664.28" fill="#805000" font-family="DM Sans" font-weight="700" font-size="16">Comparação A/O sem resposta</text><text x="92" y="690.45" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">A e O ficam excluídos; com R e E elegíveis, subtotal = R$ 2.860,00. Referências locais diferentes não completam a</text><text x="92" y="712.95" fill="#805000" font-family="DM Sans" font-weight="400" font-size="15">confirmação.</text><rect x="1068" y="332" width="324" height="390" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="374.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Seu resumo</text><text x="1092" y="413.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Valores em revisão. O resultado será</text><text x="1092" y="437.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">gerado ao calcular.</text><text x="1092" y="493.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Recursos</text><text x="1253" y="493.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 2.260,00</text><text x="1092" y="535.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Despesa externa</text><text x="1253" y="535.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 600,00</text><text x="1092" y="577.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Ajuste de receita</text><text x="1253" y="577.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 900,00</text><text x="1092" y="619.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Margem líquida</text><text x="1253" y="619.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 1.000,00</text><text x="1092" y="669.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipóteses do exemplo fictício.</text><text x="1092" y="690.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Não são perdas verificadas.</text><rect x="48" y="822" width="235" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="851.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Corrigir custo-hora</text><rect x="300" y="822" width="280" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="316" y="851.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Revisar comparação A/O</text><text x="48" y="926.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">O botão permite solicitar validação. Erros monetários não geram novo resultado; desconhecidos e conflitos seguem as</text><text x="48" y="951.61" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">exclusões documentadas. O erro isolado de indisponibilidade mantém contexto não informado e permite calcular parcelas</text><text x="48" y="977.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">válidas.</text><rect x="1068" y="822" width="324" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="1084" y="851.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver revisão válida</text></svg>