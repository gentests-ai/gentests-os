<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D04 - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D04 | Recorrência e contexto</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D04 | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Com que frequência isso pode acontecer?</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">A frequência é opcional. Um incidente isolado não prevê o comportamento dos próximos 12 meses.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="312" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="560" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="808" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="313" width="285.274" height="30" rx="15" fill="#FFF5DF" stroke="none"/><text x="60" y="331.79" fill="#805000" font-family="DM Sans" font-weight="700" font-size="13">Simulação fictícia · hipóteses constantes</text><rect x="48" y="365" width="984" height="510" rx="18" fill="#FFFFFF" stroke="none"/><text x="80" y="413.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Incidentes únicos por mês</text><rect x="80" y="428" width="410" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="94" y="457.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">3</text><text x="80" y="497.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Inteiro, do mesmo perfil. Sem frequência: projeções não</text><text x="80" y="518.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">calculáveis.</text><text x="546" y="413.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Origem da frequência</text><rect x="546" y="428" width="438" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="457.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Hipotética</text><text x="546" y="497.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Sem média ou frequência automática.</text><rect x="80" y="556" width="904" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="100" y="585.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">A projeção depende desta hipótese</text><text x="100" y="611.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Se o custo por incidente e a frequência permanecerem constantes, será possível projetar mês e 12 meses. Não é custo</text><text x="100" y="633.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">anual observado.</text><text x="80" y="708.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Indisponibilidade (h) · opcional</text><rect x="80" y="723" width="410" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="94" y="752.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado</text><text x="80" y="792.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Até 744h nesta ferramenta; incidentes reais podem durar mais.</text><text x="546" y="736.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Contexto não monetizado. Não multiplicamos</text><text x="546" y="763.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">duração por receita, salário ou tamanho da equipe.</text><rect x="1068" y="365" width="324" height="390" rx="18" fill="#FFFFFF" stroke="none"/><text x="1092" y="407.26" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="22">Seu resumo</text><text x="1092" y="446.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Valores em revisão. O resultado será</text><text x="1092" y="470.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">gerado ao calcular.</text><text x="1092" y="526.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Recursos</text><text x="1253" y="526.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 2.260,00</text><text x="1092" y="568.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Despesa externa</text><text x="1253" y="568.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 600,00</text><text x="1092" y="610.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Ajuste de receita</text><text x="1253" y="610.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 900,00</text><text x="1092" y="652.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Margem líquida</text><text x="1253" y="652.62" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="14">R$ 1.000,00</text><text x="1092" y="702.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Origem: hipóteses do exemplo fictício.</text><text x="1092" y="723.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Não são perdas verificadas.</text><rect x="48" y="926" width="170" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="955.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Voltar</text><rect x="774" y="926" width="258" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="790" y="955.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Revisar valores</text></svg>