<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>WF - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">Wireframes | Estrutura e prioridade de leitura</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">WF | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">A tarefa vem antes do formulário.</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Estrutura de baixa fidelidade. O resumo ajuda a revisar; não promete um total antes da conciliação.</text><text x="48" y="304.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">Desktop ≥1024 px</text><text x="940" y="304.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">Mobile 390 px / reflow 320 px</text><rect x="48" y="340" width="850" height="530" rx="12" fill="#FFFFFF" stroke="#64788D"/><rect x="70" y="362" width="806" height="74" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="90" y="401.43" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="21">Título, limites e exemplo fictício</text><rect x="70" y="456" width="500" height="330" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="90" y="497.09" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="23">Etapa atual</text><text x="90" y="546.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Origem → operandos → confirmação</text><text x="90" y="598.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Ajuda próxima ao campo</text><text x="90" y="648.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Erro com texto e ação de correção</text><rect x="590" y="456" width="286" height="330" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="610" y="497.43" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="21">Resumo em revisão</text><text x="610" y="542.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Sem painel fixo. Naturezas</text><text x="610" y="569.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">e origem sempre legíveis.</text><rect x="70" y="806" width="806" height="42" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="90" y="831.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Voltar / Continuar / Calcular</text><rect x="960" y="340" width="360" height="615" rx="12" fill="#FFFFFF" stroke="#64788D"/><rect x="980" y="362" width="320" height="80" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="998" y="395.77" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="19">Título + propósito</text><rect x="980" y="462" width="320" height="50" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="998" y="495.77" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="19">Etapa atual + progresso</text><rect x="980" y="532" width="320" height="190" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="998" y="565.77" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="19">Campos empilhados</text><rect x="980" y="742" width="320" height="80" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="998" y="775.77" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="19">Resumo após campos</text><rect x="980" y="842" width="320" height="90" rx="6" fill="#F3F6FA" stroke="#64788D"/><text x="998" y="875.77" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="19">Ações em fluxo</text><text x="48" y="932.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">Resultado: valor por incidente → naturezas → projeções condicionais → exclusões → memória →</text><text x="48" y="959.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">relatório. No mobile, pares comparados são empilhados e permanecem juntos; não exigir rolagem</text><text x="48" y="986.94" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="18">horizontal.</text></svg>