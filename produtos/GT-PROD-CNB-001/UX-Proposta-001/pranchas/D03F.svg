<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img"><title>D03F - proposta de interface não operacional</title><rect x="0" y="0" width="1440" height="1100" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="1440" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="1080" y="40.96" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="12">PROPOSTA UX/UI · NÃO OPERACIONAL</text><text x="48" y="121.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">D03F | Entrada de efeitos · estimativa própria</text><text x="1240" y="119.62" fill="#075BDF" font-family="DM Sans" font-weight="700" font-size="14">Índice do protótipo</text><text x="48" y="1074.13" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="11">D03F | Planejamento v0.1 | Produto v0.1.1 | 10/10/2026</text><text x="48" y="184.22" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="34">Informe efeitos financeiros já conciliados externamente.</text><text x="48" y="221.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Uma parcela por natureza. Não informe nomes, números reais de pedido, clientes ou documentos.</text><rect x="48" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="64" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">1. Esforço</text><rect x="296" y="245" width="232" height="48" rx="10" fill="#04132F" stroke="none"/><text x="312" y="274.28" fill="#FFFFFF" font-family="DM Sans" font-weight="700" font-size="16">2. Efeitos distintos</text><rect x="544" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="560" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">3. Recorrência</text><rect x="792" y="245" width="232" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="808" y="274.28" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="16">4. Revisão</text><rect x="48" y="332" width="428" height="480" rx="18" fill="#FFFFFF" stroke="none"/><text x="68" y="375.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">E · Despesa externa incremental</text><text x="68" y="457.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Estado e origem</text><rect x="68" y="472" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="82" y="501.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Desconhecido</text><text x="68" y="548.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Escolher: informado, hipotético, desconhecido ou não</text><text x="68" y="570.95" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">aplicável.</text><text x="68" y="627.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Valor (R$)</text><rect x="68" y="642" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="82" y="671.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado</text><text x="68" y="711.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Vazio não é zero.</text><text x="68" y="748.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Somente despesa atribuível ao incidente, fora do</text><text x="68" y="772.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">custo-hora ou contrato fixo.</text><rect x="500" y="332" width="428" height="480" rx="18" fill="#FFFFFF" stroke="none"/><text x="520" y="375.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">A · Ajuste líquido de receita</text><text x="520" y="457.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Estado e origem</text><rect x="520" y="472" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="534" y="501.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Desconhecido</text><text x="520" y="548.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Escolher: informado, hipotético, desconhecido ou não</text><text x="520" y="570.95" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">aplicável.</text><text x="520" y="627.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Valor (R$)</text><rect x="520" y="642" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="534" y="671.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado</text><text x="520" y="711.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Vazio não é zero.</text><text x="520" y="748.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Crédito ou estorno líquido atribuível ao incidente.</text><text x="520" y="772.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Não presumir desembolso.</text><rect x="952" y="332" width="428" height="480" rx="18" fill="#FFFFFF" stroke="none"/><text x="972" y="375.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">O · Margem líquida não</text><text x="972" y="409.59" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">recuperável</text><text x="972" y="457.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Estado e origem</text><rect x="972" y="472" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="986" y="501.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">Desconhecido</text><text x="972" y="548.45" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">Escolher: informado, hipotético, desconhecido ou não</text><text x="972" y="570.95" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="15">aplicável.</text><text x="972" y="627.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Valor (R$)</text><rect x="972" y="642" width="388" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="986" y="671.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado</text><text x="972" y="711.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Vazio não é zero.</text><text x="972" y="748.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Margem já apurada com o financeiro, sem receita</text><text x="972" y="772.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">bruta ou venda recuperada.</text><rect x="48" y="850" width="880" height="103.0" rx="12" fill="#E6F8F5" stroke="none"/><text x="68" y="879.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Depois dos valores, comparar os pares</text><text x="68" y="905.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Selecionar referência local anônima de evento. A referência orienta o preenchimento; não verifica duplicidade.</text><text x="68" y="927.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Comparações só usam origens e valores válidos.</text><rect x="960" y="876" width="432" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="976" y="905.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Ver comparação com dados fictícios</text></svg>