<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1340" viewBox="0 0 390 1340" role="img"><title>M04 - proposta de interface não operacional</title><rect x="0" y="0" width="390" height="1340" rx="0" fill="#F3F6FA" stroke="none"/><rect x="0" y="0" width="390" height="80" rx="0" fill="#04132F" stroke="none"/><image x="24" y="14" width="50" height="50" href="../assets/icone-gentests.png"/><text x="88" y="46.58" fill="#FFFFFF" font-family="Manrope" font-weight="700" font-size="26">GenTests</text><text x="290" y="41.79" fill="#34E2D1" font-family="DM Sans" font-weight="700" font-size="13">Protótipo</text><text x="20" y="111.62" fill="#52677D" font-family="DM Sans" font-weight="700" font-size="14">M04 | Recorrência e revisão</text><text x="20" y="1311.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">M04 | Planejamento v0.1 | Produto v0.1.1</text><text x="20" y="1327.3" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="10">10/10/2026 · Proposta não operacional</text><text x="20" y="167.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">Recorrência é uma</text><text x="20" y="209.24" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="28">hipótese opcional.</text><rect x="20" y="245" width="149.372" height="30" rx="15" fill="#E6F8F5" stroke="none"/><text x="32" y="263.79" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="13">3 de 4 · Recorrência</text><text x="20" y="325.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Incidentes únicos por mês</text><rect x="20" y="340" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="34" y="369.11" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="17">3</text><text x="20" y="409.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Hipotético · mesmo perfil de incidente.</text><rect x="20" y="445" width="350" height="125.5" rx="12" fill="#E6F8F5" stroke="none"/><text x="40" y="474.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Custo e frequência constantes</text><text x="40" y="500.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">Sem frequência, mês e 12 meses ficam “não</text><text x="40" y="522.95" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">calculável”. Não estimar uma média</text><text x="40" y="545.45" fill="#142B3F" font-family="DM Sans" font-weight="400" font-size="15">automaticamente.</text><text x="20" y="665.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Indisponibilidade (h) · opcional</text><rect x="20" y="680" width="350" height="48" rx="8" fill="#FFFFFF" stroke="#64788D"/><text x="34" y="709.11" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="17">Não informado</text><text x="20" y="749.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">Até 744h nesta ferramenta; incidentes reais podem</text><text x="20" y="770.62" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="14">durar mais. Contexto não monetizado.</text><rect x="20" y="850" width="350" height="209" rx="16" fill="#FFFFFF" stroke="none"/><text x="40" y="891.09" fill="#142B3F" font-family="Manrope" font-weight="700" font-size="23">Revisão · exemplo</text><text x="40" y="937.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">R = 2.260,00 · E = 600,00</text><text x="40" y="961.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">A = 900,00 · O = 1.000,00</text><text x="40" y="985.28" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="16">Relações distintas: hipóteses fictícias.</text><rect x="20" y="1090" width="350" height="48" rx="10" fill="#34E2D1" stroke="none"/><text x="36" y="1119.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Calcular estimativa</text><rect x="20" y="1154" width="350" height="48" rx="10" fill="#FFFFFF" stroke="#64788D"/><text x="36" y="1183.28" fill="#142B3F" font-family="DM Sans" font-weight="700" font-size="16">Editar parcelas</text><text x="20" y="1240.79" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="13">As etapas 3 e 4 estão reunidas nesta prancha de</text><text x="20" y="1260.29" fill="#52677D" font-family="DM Sans" font-weight="400" font-size="13">documentação; na UI são etapas separadas.</text></svg>