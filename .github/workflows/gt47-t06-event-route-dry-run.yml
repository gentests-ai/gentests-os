name: 06 - GTS47 Rota (simulacao)
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  issues: read
jobs:
  route-dry-run:
    if: ${{ github.event.issue.number == 47 }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate route without API or writes
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.gt47_t04_context_loader import ContextRejected
          from scripts.gt47_t06_event_planner import plan_issue_event
          try:
              result = plan_issue_event(Path(os.environ["EVENT_PATH"]).read_bytes())
          except ContextRejected as exc:
              print("GT47 route ignored (fail closed):", exc)
              raise SystemExit(0)
          print("GT47 dry-run route:", result["agent_id"])
          assert result["execution_allowed"] is False
          assert result["github_write"] is False
          PY
