name: Verificar Markdown
run-name: 'Markdown e links | ${{ github.event_name }} | ${{ github.head_ref || github.ref_name }}'
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checar links internos
        run: python3 scripts/check_links.py
