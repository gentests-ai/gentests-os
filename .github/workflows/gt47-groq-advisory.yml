name: GT47 bounded Groq advisory handoff
on:
  workflow_run:
    workflows: [Piloto QG Email Comercial]
    types: [completed]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
# All entry points use the same queue and budget. GitHub may replace pending
# runs in this group; the durable state is the queue, not workflow records.
concurrency:
  group: gt47-global-groq-advisory
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      vars.GT47_GROQ_ENABLED == 'true' &&
      vars.GROQ_FREE_PLAN_CONFIRMED == 'true' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.head.outputs.commit }}
      enqueue: ${{ steps.head.outputs.enqueue }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: head
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = workflow_run ]; then
            test "$commit" = "$VALIDATED_SHA"
            test -f gt47-advisory-task.txt
            echo 'enqueue=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Offline checks before enqueue (no secrets)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/gt47-venv"
          "$RUNNER_TEMP/gt47-venv/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: --index-url https://pypi.org/simple -r requirements-t04b-ci.txt
          "$RUNNER_TEMP/gt47-venv/bin/python" -m pip check
          "$RUNNER_TEMP/gt47-venv/bin/python" -m unittest discover -s tests -p 'test_*.py'
          "$RUNNER_TEMP/gt47-venv/bin/python" scripts/check_links.py
          test -z "$(git status --porcelain)"
  advance:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # Only implementation uses this for durable state branch.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Reserve quota and advance one advisory stage
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GT47_GROQ_ENABLED: ${{ vars.GT47_GROQ_ENABLED }}
          GROQ_FREE_PLAN_CONFIRMED: ${{ vars.GROQ_FREE_PLAN_CONFIRMED }}
          SOURCE_SHA: ${{ needs.validate.outputs.commit }}
          ENQUEUE: ${{ needs.validate.outputs.enqueue }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          if [ "$ENQUEUE" = true ]; then
            python3 -m scripts.gt47_t06_groq_runner --commit "$SOURCE_SHA" --enqueue gt47-advisory-task.txt
          else
            python3 -m scripts.gt47_t06_groq_runner --commit "$SOURCE_SHA"
          fi
