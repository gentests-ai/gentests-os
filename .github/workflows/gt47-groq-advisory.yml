name: 09 - GTS47 Groq ENG-QA
run-name: "09 - Groq ENG-QA #${{ github.run_number }} | ${{ github.event_name }}"
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
# All entry points use the same queue and budget. GitHub may replace pending
# runs in this group; the durable state is the queue, not workflow records.
concurrency:
  group: gt47-global-groq-advisory
  cancel-in-progress: false
jobs:
  probe:
    if: >-
      vars.GT47_GROQ_ENABLED == 'true' &&
      vars.GROQ_FREE_PLAN_CONFIRMED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      commit: ${{ steps.head.outputs.commit }}
      status: ${{ steps.queue.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/heads/main
          persist-credentials: false
      - id: head
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: queue
        env:
          GH_TOKEN: ${{ github.token }}
          GT47_GROQ_ENABLED: ${{ vars.GT47_GROQ_ENABLED }}
          GROQ_FREE_PLAN_CONFIRMED: ${{ vars.GROQ_FREE_PLAN_CONFIRMED }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m scripts.gt47_t06_groq_runner --inspect
  advance:
    needs: probe
    if: needs.probe.result == 'success' && needs.probe.outputs.status == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write # Only implementation uses this for durable state branch.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.probe.outputs.commit }}
          persist-credentials: false
      - name: Reserve quota and advance one advisory stage
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GT47_GROQ_ENABLED: ${{ vars.GT47_GROQ_ENABLED }}
          GROQ_FREE_PLAN_CONFIRMED: ${{ vars.GROQ_FREE_PLAN_CONFIRMED }}
          SOURCE_SHA: ${{ needs.probe.outputs.commit }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          python3 -m scripts.gt47_t06_groq_runner --commit "$SOURCE_SHA"
