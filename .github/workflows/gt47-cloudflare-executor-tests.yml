name: GT47 Cloudflare executor offline checks
on:
  pull_request:
    paths:
      - "cloudflare/gt47-executor/**"
      - ".github/workflows/gt47-cloudflare-executor-tests.yml"
permissions:
  contents: read
jobs:
  worker-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Syntax check
        working-directory: cloudflare/gt47-executor
        run: node --check src/index.js
      - name: Offline contract tests
        working-directory: cloudflare/gt47-executor
        run: npm test
