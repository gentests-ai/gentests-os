name: GT47 T06 Offline Tests
run-name: GT47 ${{ inputs.phase || 'offline' }} ${{ inputs.trial || github.sha }}
on:
  pull_request:
    paths:
      - "scripts/gt47_t06_*.py"
      - "tests/test_gt47_t06_*.py"
      - ".github/workflows/gt47-t06-offline-tests.yml"
      - ".github/workflows/gt47-groq-advisory.yml"
  workflow_dispatch:
    inputs:
      enable_test_writes:
        description: Explicitly allow isolated recovery trial state writes (no AI)
        type: boolean
        default: false
      trial:
        description: Isolated recovery trial ID, 8-40 lowercase letters/digits/hyphens
        type: string
        default: qa-recovery-manual
      phase:
        description: Recovery rehearsal phase
        type: choice
        options: [seed, advance, inspect, interrupt]
        default: inspect
      hold_seconds:
        description: Optional seed concurrency occupancy (0 or 660 seconds)
        type: number
        default: 0
permissions:
  contents: read
jobs:
  offline-tests:
    if: github.event_name != 'workflow_dispatch' || inputs.enable_test_writes != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate T06 without API credentials
        run: python -m unittest discover -s tests -p 'test_gt47_t06_*.py' -v
  recovery-rehearsal:
    if: github.event_name == 'workflow_dispatch' && inputs.enable_test_writes == true
    concurrency:
      group: gt47-recovery-${{ inputs.trial }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c6ffa661be39a793bcdd43ab226fd4770453cba7 # QA-reviewed controller; no merge needed
          persist-credentials: false
      - name: Isolated branch rehearsal, fixed synthetic provider
        env:
          GH_TOKEN: ${{ github.token }}
          TRIAL: ${{ inputs.trial }}
          PHASE: ${{ inputs.phase }}
          HOLD_SECONDS: ${{ inputs.hold_seconds }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          test "$HOLD_SECONDS" = 0 || test "$HOLD_SECONDS" = 660
          if [ "$HOLD_SECONDS" = 660 ]; then test "$PHASE" = seed; fi
          commit=$(git rev-parse HEAD)
          if [ "$PHASE" = seed ]; then
            # Keep state refs based on default-branch files. Pointing a new
            # ref at PR commits that change workflows may require workflow
            # administration rights; the test state needs only JSON writes.
            python3 - <<'PY'
          import os
          from scripts.gt47_t06_groq_runner import GitHubStore
          from scripts.gt47_t06_recovery_rehearsal import test_branch
          store = GitHubStore(os.environ['GH_TOKEN'], branch=test_branch(os.environ['TRIAL']))
          code, ref = store.request('GET', '/git/ref/heads/main')
          if code != 200:
              raise SystemExit('::error::Default branch unavailable for isolated state')
          store.initialize(ref['object']['sha'])
          PY
          fi
          if [ "$PHASE" = interrupt ]; then
            set +e
            timeout --signal=TERM 30s python3 -m scripts.gt47_t06_recovery_rehearsal --trial "$TRIAL" --commit "$commit" --phase interrupt --allow-test-writes
            outcome=$?
            set -e
            test "$outcome" = 124
            set +e
            python3 -m scripts.gt47_t06_recovery_rehearsal --trial "$TRIAL" --commit "$commit" --phase inspect --allow-test-writes > "$RUNNER_TEMP/recovery.json"
            inspected=$?
            set -e
            test "$inspected" = 2
            python3 -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/recovery.json")); assert r["status"]=="manual_reconciliation_required" and r["synthetic_submissions"]==1 and r["inference_calls"]==0'
          else
            set +e
            python3 -m scripts.gt47_t06_recovery_rehearsal --trial "$TRIAL" --commit "$commit" --phase "$PHASE" --allow-test-writes 2> "$RUNNER_TEMP/recovery-error.txt"
            outcome=$?
            set -e
            if [ "$outcome" != 0 ]; then
              python3 -c 'import os; lines=open(os.environ["RUNNER_TEMP"]+"/recovery-error.txt").read().splitlines(); msg=lines[-1] if lines else "Recovery failed"; safe=("ValueError: GitHub state HTTP failure","ValueError: state branch initialization failed; reconcile","ValueError: state branch unavailable","ValueError: invalid state response"); print("::error::"+(msg if msg in safe else "Recovery failed; inspect redacted run logs"))'
              exit "$outcome"
            fi
            if [ "$HOLD_SECONDS" = 660 ]; then sleep 660; fi
          fi
