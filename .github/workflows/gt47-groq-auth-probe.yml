name: 13 - GTS47 Groq acesso (sem inferencia)
run-name: "13 - Groq acesso #${{ github.run_number }}"
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && vars.GT47_GROQ_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One GET models request (no prompts, retries or state writes)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, sys
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect refused')
          key = os.environ.get('GROQ_API_KEY', '')
          if not key.strip():
              print('GROQ_API_KEY missing; no request')
              sys.exit(2)
          request = Request('https://api.groq.com/openai/v1/models', method='GET',
              headers={'Authorization': 'Bearer ' + key, 'Accept': 'application/json'})
          try:
              with build_opener(NoRedirect).open(request, timeout=20) as response:
                  status = response.status
                  raw = response.read(262145)
              if status != 200 or len(raw) > 262144:
                  raise ValueError('invalid response')
              data = json.loads(raw)
              models = data.get('data') if type(data) is dict else None
              if type(models) is not list or any(type(m) is not dict for m in models):
                  raise ValueError('invalid models')
              found = any(m.get('id') == 'openai/gpt-oss-120b' for m in models)
              print(json.dumps({'http_status': status, 'target_model_listed': found,
                                'inference_calls': 0}))
              if not found:
                  sys.exit(2)
          except HTTPError as exc:
              code = exc.code if type(exc.code) is int and 100 <= exc.code <= 599 else 'unknown'
              print(json.dumps({'http_status': code, 'inference_calls': 0}))
              sys.exit(2)
          except Exception:
              print('Models probe failed; response and exception details suppressed; no retry')
              sys.exit(2)
