name: 13 - GTS47 Groq acesso (sem inferencia)
run-name: "13 - Groq acesso #${{ github.run_number }}"
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.ref == 'refs/heads/main' && vars.GT47_GROQ_ENABLED == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: One GET models request (no prompts, retries or state writes)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        shell: python
        run: |
          import json, os, sys
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError
          def report(value):
              line = json.dumps(value)
              print(line)
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as output:
                      output.write('### Groq access probe (zero inference)\n\n```json\n' + line + '\n```\n')
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('redirect refused')
          key = os.environ.get('GROQ_API_KEY', '')
          if not key.strip():
              print('GROQ_API_KEY missing; no request')
              sys.exit(2)
          if not key.isascii() or any(c.isspace() or ord(c) < 32 or ord(c) == 127 for c in key):
              report({'reason': 'secret_format_invalid', 'inference_calls': 0})
              sys.exit(2)
          request = Request('https://api.groq.com/openai/v1/models', method='GET',
              headers={'Authorization': 'Bearer ' + key, 'Accept': 'application/json',
                       'User-Agent': 'GTS47-Access-Probe/1.0'})
          stage = 'connection'
          status = None
          try:
              with build_opener(NoRedirect).open(request, timeout=20) as response:
                  status = response.status
                  raw = response.read(262145)
              stage = 'response_validation'
              if status != 200 or len(raw) > 262144:
                  raise ValueError('invalid response')
              data = json.loads(raw)
              models = data.get('data') if type(data) is dict else None
              if type(models) is not list or any(type(m) is not dict for m in models):
                  raise ValueError('invalid models')
              found = any(m.get('id') == 'openai/gpt-oss-120b' for m in models)
              report({'http_status': status, 'target_model_listed': found,
                      'inference_calls': 0})
              if not found:
                  sys.exit(2)
          except HTTPError as exc:
              code = exc.code if type(exc.code) is int and 100 <= exc.code <= 599 else 'unknown'
              # Classify without rendering response headers, messages or bodies.
              category = 'unclassified_http_error'
              try:
                  body = exc.read(16385)
                  if len(body) <= 16384:
                      text = body.decode('utf-8', errors='replace')
                      if 'error code: 1010' in text.lower():
                          category = 'edge_client_block_1010'
                      elif 'error code: 1020' in text.lower():
                          category = 'edge_access_denied_1020'
                      else:
                          parsed = json.loads(text)
                          error = parsed.get('error') if type(parsed) is dict else None
                          if type(error) is dict:
                              category = 'api_json_error'
                              known = {'invalid_api_key', 'model_permission_blocked',
                                       'organization_restricted', 'permission_denied'}
                              if type(error.get('code')) is str and error['code'] in known:
                                  category = error['code']
              except Exception:
                  pass
              report({'http_status': code, 'category': category, 'inference_calls': 0})
              sys.exit(2)
          except Exception as exc:
              # Only fixed categories; no raw exception, body, URL or key.
              categories = {'URLError': 'network_error', 'TimeoutError': 'timeout',
                  'SSLError': 'tls_error', 'JSONDecodeError': 'invalid_json',
                  'UnicodeDecodeError': 'invalid_encoding', 'ValueError': 'invalid_value',
                  'UnicodeEncodeError': 'invalid_encoding', 'OSError': 'network_error'}
              report({'stage': stage, 'http_status': status,
                  'reason': categories.get(type(exc).__name__, 'unexpected_error'),
                  'inference_calls': 0})
              sys.exit(2)
